<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>LinkedIn AI Reply Assistant - Options</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 720px; margin: 30px auto; padding: 0 16px; }
      .card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; }
      h1 { margin-top: 0; }
      label { display: block; margin-top: 12px; }
      input, select { width: 100%; margin-top: 4px; padding: 8px; box-sizing: border-box; }
      button { margin-top: 16px; padding: 10px 14px; background: #0a66c2; color: white; border: none; border-radius: 8px; }
      .status { margin-top: 12px; color: #166534; min-height: 1em; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>LinkedIn AI Reply Assistant</h1>
      <p>Configure AI generation settings used when you click <strong>Suggest reply</strong> inside LinkedIn comment boxes.</p>

      <label>OpenAI API Key
        <input id="apiKey" type="password" placeholder="sk-..." />
      </label>
      <label>Model
        <input id="model" type="text" value="gpt-4o-mini" />
      </label>
      <label>Tone
        <select id="tone">
          <option value="professional">Professional</option>
          <option value="friendly">Friendly</option>
          <option value="insightful">Insightful</option>
          <option value="direct">Direct</option>
        </select>
      </label>
      <label>Suggestions per click
        <input id="suggestionCount" type="number" min="1" max="6" value="3" />
      </label>
      <label>Max words per suggestion
        <input id="maxWords" type="number" min="10" max="120" value="45" />
      </label>

      <button id="save">Save settings</button>
      <div class="status" id="saved"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
