<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>LinkedIn AI Reply Assistant</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 12px; width: 280px; }
      label { display: block; margin-top: 8px; font-size: 12px; color: #374151; }
      input, select { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 6px; }
      button { margin-top: 12px; width: 100%; padding: 8px; background: #0a66c2; color: #fff; border: none; border-radius: 8px; }
      .help { margin-top: 8px; font-size: 11px; color: #6b7280; }
      .saved { font-size: 12px; color: #166534; margin-top: 8px; min-height: 14px; }
    </style>
  </head>
  <body>
    <h3>LinkedIn AI Reply Assistant</h3>

    <label>OpenAI API Key
      <input id="apiKey" type="password" placeholder="sk-..." />
    </label>

    <label>Model
      <input id="model" type="text" value="gpt-4o-mini" />
    </label>

    <label>Tone
      <select id="tone">
        <option value="professional">Professional</option>
        <option value="friendly">Friendly</option>
        <option value="insightful">Insightful</option>
        <option value="direct">Direct</option>
      </select>
    </label>

    <label>Suggestions per click
      <input id="suggestionCount" type="number" min="1" max="6" value="3" />
    </label>

    <label>Max words per suggestion
      <input id="maxWords" type="number" min="10" max="120" value="45" />
    </label>

    <button id="save">Save</button>
    <div id="saved" class="saved"></div>
    <div class="help">Tip: Open options for the same settings in full page view.</div>

    <script src="popup.js"></script>
  </body>
</html>
